server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Re-resolve Railway's private hostname after backend redeploys.
  resolver [fd12::10] valid=1s ipv6=on;
  set $clutch_api "http://clutch-arena-api.railway.internal:4000";

  location /api/ {
    proxy_pass $clutch_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
}
